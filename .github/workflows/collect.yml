name: Collect & Deploy

on:
  schedule:
    # Runs at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger from the GitHub UI

permissions:
  contents: write   # needed to git-commit data files
  pages: write      # needed to deploy to GitHub Pages
  id-token: write   # needed by actions/deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    name: Collect GitHub Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a token with write access so the push step works
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install collector dependencies
        run: npm ci

      - name: Run data collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run collect

      - name: Commit data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "chore(data): daily snapshot $(date -u +'%Y-%m-%d')"
          git push

  deploy:
    name: Build & Deploy Dashboard
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Pull latest so we get the freshly committed data files
          ref: main

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Copy data files into dashboard dist
        # The dashboard fetches /RepoRadar/data/latest.json at runtime.
        # Pages only serves dashboard/dist/, so we bundle the data/ folder
        # into the artifact here so the fetch resolves correctly.
        run: cp -r data/ dashboard/dist/data/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
